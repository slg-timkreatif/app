<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pindah ke Galeri Guru Berbagi Baru</title>
    
    <!-- Auto Redirect setelah 5 detik -->
    <!-- GANTI URL_DI_BAWAH_INI dengan link Cloudflare Pages Anda -->
    <meta http-equiv="refresh" content="5;url=https://galeri-gb.pages.dev">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #FAF7F2;
            --surface: #FFFFFF;
            --primary: #1B5E4F;
            --primary-hover: #14483D;
            --text-main: #2A2520;
            --text-muted: #5E574F;
            --border: #E5DED3;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(circle at 1px 1px, rgba(27, 94, 79, 0.1) 1px, transparent 0);
            background-size: 24px 24px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px -10px rgba(42, 37, 32, 0.08);
            position: relative;
            overflow: hidden;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Efek Glow di belakang ikon */
        .glow {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 200px;
            background: rgba(27, 94, 79, 0.1);
            border-radius: 50%;
            filter: blur(40px);
            z-index: 0;
        }

        .icon-wrapper {
            width: 72px;
            height: 72px;
            background: var(--primary);
            color: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            position: relative;
            z-index: 1;
            box-shadow: 0 8px 20px rgba(27, 94, 79, 0.2);
        }

        .icon-wrapper svg {
            width: 32px;
            height: 32px;
        }

        h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 28px;
            position: relative;
            z-index: 1;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            padding: 14px 28px;
            border-radius: 14px;
            width: 100%;
            transition: all 0.2s ease;
            position: relative;
            z-index: 1;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(27, 94, 79, 0.2);
        }

        .timer-text {
            margin-top: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            position: relative;
            z-index: 1;
        }

        .timer-text span {
            color: var(--primary);
            font-weight: 800;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .card { padding: 32px 24px; }
            h1 { font-size: 20px; }
        }
    </style>
  <link rel="stylesheet" href="ui-core.css?v=1.0">
</head>
<body>

    <div class="card">
        <div class="glow"></div>
        
        <div class="icon-wrapper">
            <!-- Ikon Bintang / Roket Premium -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
            </svg>
        </div>

        <h1>Kami Telah Pindah!</h1>
        <p>Galeri Guru Berbagi Selogiri kini hadir dengan wajah baru dan fitur yang lebih canggih. Anda akan dialihkan secara otomatis.</p>

        <!-- GANTI HREF DI BAWAH INI DENGAN URL CLOUDFLARE PAGES ANDA -->
        <a href="https://galeri-gb.pages.dev" class="btn">
            Buka Aplikasi Baru
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
            </svg>
        </a>

        <div class="timer-text">
            Mengalihkan dalam <span id="countdown">5</span> detik...
        </div>
    </div>

    <script>
        // Script untuk hitung mundur visual
        let timeLeft = 5;
        const countdownEl = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            timeLeft--;
            if (countdownEl) countdownEl.textContent = timeLeft;
            if (timeLeft <= 0) clearInterval(timer);
        }, 1000);
    </script>

</body>
</html>
