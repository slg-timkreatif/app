<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/slg-timkreatif/ortu/refs/heads/main/sapa.png">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/slg-timkreatif/ortu/refs/heads/main/sapa.png">
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
    
    <title>SAPA - Sistem Absensi Pemantauan Anak</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { darkbg: '#0f172a', darkcard: '#1e293b' }, fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] } } }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        ::-webkit-scrollbar { width: 0px; }
        .glass-panel { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.4); }
        .dark .glass-panel { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.05); }
        #reader { width: 100%; border-radius: 1.5rem; overflow: hidden; border: none !important; }
        #reader video { border-radius: 1.5rem; object-fit: cover; }
        .scanner-laser { height: 3px; background: linear-gradient(to right, transparent, #3b82f6, transparent); position: absolute; width: 85%; left: 7.5%; animation: scanning 2.5s ease-in-out infinite; }
        @keyframes scanning { 0%, 100% { top: 15%; opacity: 0.3; } 50% { top: 85%; opacity: 1; } }
        .blob { position: absolute; filter: blur(80px); z-index: -1; opacity: 0.5; pointer-events: none; }
        .blob-1 { top: -10%; left: -10%; width: 300px; height: 300px; background: #dbeafe; }
        .blob-2 { bottom: -10%; right: -10%; width: 250px; height: 250px; background: #e0e7ff; }
        .dark .blob-1 { background: #172554; opacity: 0.3; }
        .dark .blob-2 { background: #312e81; opacity: 0.3; }
        
        /* Modifikasi SweetAlert */
        .swal2-popup { border-radius: 1.5rem !important; font-family: 'Plus Jakarta Sans', sans-serif !important; }
        .swal2-confirm, .swal2-cancel { border-radius: 0.75rem !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-darkbg dark:text-slate-200 h-screen flex flex-col overflow-hidden relative transition-colors duration-500">

    <div class="blob blob-1 animate-pulse"></div>
    <div class="blob blob-2 animate-pulse" style="animation-delay: 2s;"></div>

    <header class="px-6 py-4 flex items-center justify-between z-10 shrink-0 border-b border-slate-200/30 dark:border-slate-800/30">
        <div class="flex items-center gap-3">
            <img src="https://raw.githubusercontent.com/slg-timkreatif/ortu/refs/heads/main/sapa.png" alt="Logo" class="w-8 h-8 rounded-lg shadow-sm">
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-2xl font-black tracking-tight text-blue-600 dark:text-blue-400">SAPA</h1>
                    <span id="sync-badge" class="text-[9px] font-extrabold bg-blue-100 text-blue-600 px-2 py-0.5 rounded-md uppercase tracking-wider transition-colors">Sinkronisasi</span>
                </div>
                <p class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest">Kecamatan Selogiri</p>
            </div>
        </div>
        
        <div class="flex items-center gap-3 glass-panel px-3.5 py-1.5 rounded-full shadow-sm">
            <div class="w-8 h-8 rounded-full overflow-hidden bg-slate-200 dark:bg-slate-700 border border-white dark:border-slate-600 shadow-sm shrink-0">
                <img id="guru-photo" src="" alt="Guru" class="w-full h-full object-cover hidden">
                <i data-lucide="user" class="w-4 h-4 m-2 text-slate-400" id="guru-icon-fallback"></i>
            </div>
            <div class="flex flex-col min-w-0 max-w-[100px]">
                <span id="guru-nama" class="text-xs font-bold leading-tight truncate">Tamu</span>
                <span class="text-[8px] font-bold text-slate-400 uppercase tracking-wider truncate" id="guru-instansi">Petugas</span>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto px-5 py-4 flex flex-col gap-5 pb-24">
        <div class="glass-panel p-2 rounded-[2rem] shadow-xl shadow-slate-900/5 relative shrink-0 overflow-hidden">
            <div class="scanner-laser z-20"></div>
            <div class="absolute top-6 left-6 w-8 h-8 border-t-4 border-l-4 border-blue-500 dark:border-blue-400 rounded-tl-xl z-20"></div>
            <div class="absolute top-6 right-6 w-8 h-8 border-t-4 border-r-4 border-blue-500 dark:border-blue-400 rounded-tr-xl z-20"></div>
            <div class="absolute bottom-6 left-6 w-8 h-8 border-b-4 border-l-4 border-blue-500 dark:border-blue-400 rounded-bl-xl z-20"></div>
            <div class="absolute bottom-6 right-6 w-8 h-8 border-b-4 border-r-4 border-blue-500 dark:border-blue-400 rounded-br-xl z-20"></div>
            <div id="reader" class="bg-slate-900/5 dark:bg-black/20 w-full aspect-[4/4] flex items-center justify-center relative"></div>
        </div>

        <div class="flex-1 flex flex-col min-h-[200px]">
            <div class="flex items-center justify-between px-1 mb-3 shrink-0">
                <div class="flex items-center gap-2">
                    <div class="w-1 h-4 bg-blue-600 dark:bg-blue-500 rounded-full"></div>
                    <h3 class="text-xs font-extrabold uppercase tracking-wider text-slate-500 dark:text-slate-400">Daftar Kehadiran</h3>
                </div>
                <span id="log-count" class="text-[10px] font-bold bg-slate-200/60 dark:bg-slate-800 text-slate-600 dark:text-slate-400 px-2.5 py-0.5 rounded-full">0 Siswa</span>
            </div>
            
            <div id="log-container" class="flex-1 overflow-y-auto space-y-2.5 max-h-[300px] pr-1 pb-10">
                <div id="log-empty" class="text-center py-8 border-2 border-dashed border-slate-200 dark:border-slate-800 rounded-2xl flex flex-col items-center justify-center text-slate-400 gap-1">
                    <i data-lucide="history" class="w-5 h-5 opacity-60"></i>
                    <span class="text-xs">Belum ada data presensi hari ini</span>
                </div>
            </div>
        </div>
    </main>

    <div id="confirm-modal" class="fixed inset-0 z-50 flex items-end justify-center hidden">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity duration-300 opacity-0 modal-overlay" onclick="closeModal()"></div>
        <div id="modal-content" class="bg-white dark:bg-slate-800 w-full rounded-t-[2.5rem] p-6 pb-8 relative z-10 shadow-2xl transform translate-y-full transition-transform duration-300">
            <div class="w-12 h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full mx-auto -mt-2 mb-6"></div>
            
            <div class="flex items-center gap-4 p-4 rounded-2xl bg-blue-50 dark:bg-blue-950/40 border border-blue-100/50 dark:border-blue-900/30 mb-6">
                <div class="w-12 h-12 bg-blue-600 text-white rounded-xl flex items-center justify-center shadow-md shadow-blue-500/20 shrink-0">
                    <i data-lucide="user-check" class="w-6 h-6"></i>
                </div>
                <div class="min-w-0 flex-1">
                    <p id="siswa-sekolah" class="text-[10px] font-extrabold text-blue-600 dark:text-blue-400 uppercase tracking-wider mb-0.5">MENCARI DATA...</p>
                    <h3 id="siswa-nama" class="text-lg font-black text-slate-800 dark:text-white truncate">Tunggu sebentar...</h3>
                    <p id="siswa-kelas-id" class="text-xs text-slate-400 font-medium">Validasi internal server</p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3.5">
                <button onclick="closeModal()" class="py-4 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-bold text-sm active:scale-95 transition">Batal</button>
                <button onclick="queuePresensi()" id="btn-submit" class="py-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm shadow-lg shadow-blue-500/20 flex justify-center items-center gap-2 active:scale-95 transition">
                    <span>Konfirmasi</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const CONFIG = {
            scriptURL: "https://script.google.com/macros/s/AKfycby1OjnfEnQNu2nSgIfSZRHGNgAJpb_qmL9ChwSzjlW3Bf8dS2jhPDpo-0R6AcuqXv7uWA/exec"
        };

        let html5QrcodeScanner;
        let scannedQRString = ""; 
        let tempSiswaData = {};
        
        let scanQueue = JSON.parse(localStorage.getItem('sapa_queue')) || [];
        let isProcessingQueue = false;
        
        function initApp() {
            initTheme();
            
            const savedProfile = localStorage.getItem('guru_profile');
            let instansiGuru = "";
            if (savedProfile) {
                try {
                    const profile = JSON.parse(savedProfile);
                    document.getElementById('guru-nama').innerText = profile.nama.split(' ')[0] || "Guru";
                    instansiGuru = profile.instansi;
                    if (instansiGuru) document.getElementById('guru-instansi').innerText = instansiGuru;
                    if (profile.foto) {
                        const img = document.getElementById('guru-photo');
                        img.src = profile.foto;
                        img.classList.remove('hidden');
                        document.getElementById('guru-icon-fallback').classList.add('hidden');
                    }
                } catch(e) {}
            } else {
                Swal.fire({
                    icon: 'info',
                    title: 'Mode Tamu',
                    text: 'Sesi login Guru Berbagi tidak ditemukan.',
                    toast: true,
                    position: 'top-end',
                    showConfirmButton: false,
                    timer: 3000
                });
            }
            
            initScanner();
            updateSyncBadge();
            if (scanQueue.length > 0) processQueue();
            if(instansiGuru) fetchSharedHistory(instansiGuru);
        }

        // TEMA OTOMATIS MENGIKUTI SISTEM HP (Real-time)
        function initTheme() {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
            const applyTheme = (isDark) => {
                if (isDark) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            };
            applyTheme(prefersDark.matches);
            prefersDark.addEventListener('change', (e) => applyTheme(e.matches));
        }

        function initScanner() {
            html5QrcodeScanner = new Html5Qrcode("reader");
            const config = { fps: 15, qrbox: (w, h) => { const min = Math.min(w, h); return { width: Math.floor(min * 0.65), height: Math.floor(min * 0.65) }; }, aspectRatio: 1.0 };
            
            html5QrcodeScanner.start({ facingMode: "environment" }, config, onScanSuccess)
            .catch(err => {
                Html5Qrcode.getCameras().then(devices => {
                    if (devices && devices.length) html5QrcodeScanner.start(devices[devices.length - 1].id, config, onScanSuccess);
                }).catch(e => {
                    document.getElementById('reader').innerHTML = `<div class="text-center p-6 text-red-500 text-xs font-bold"><i data-lucide="camera-off" class="w-10 h-10 mx-auto mb-3 opacity-80"></i>Kamera terblokir. Gunakan Google Chrome.</div>`;
                    lucide.createIcons();
                });
            });
        }

        function onScanSuccess(decodedText) {
            html5QrcodeScanner.pause();
            scannedQRString = decodedText; 
            
            document.getElementById('siswa-sekolah').innerText = "MENGHUBUNGKAN SERVER...";
            document.getElementById('siswa-nama').innerText = "Memuat Nama Siswa...";
            document.getElementById('siswa-kelas-id').innerText = "Mencari data...";
            
            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.disabled = true;
            btnSubmit.classList.add('opacity-40', 'cursor-not-allowed');
            
            triggerAudioFeedback('success');
            if(navigator.vibrate) navigator.vibrate(80);
            openModal();
            
            var namaPetugas = document.getElementById('guru-nama').innerText;
            fetch(CONFIG.scriptURL, {
                method: 'POST',
                body: JSON.stringify({ nisn: scannedQRString, action: "lookup", petugas: namaPetugas })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    document.getElementById('siswa-sekolah').innerText = data.sekolah.toUpperCase();
                    document.getElementById('siswa-nama').innerText = data.nama;
                    document.getElementById('siswa-kelas-id').innerText = "Kelas: " + data.kelas + " | NISN: " + scannedQRString.split('-')[1];
                    
                    tempSiswaData = { nama: data.nama, kelas: data.kelas, qr: scannedQRString, petugas: namaPetugas };
                    btnSubmit.disabled = false;
                    btnSubmit.classList.remove('opacity-40', 'cursor-not-allowed');
                } else {
                    throw new Error(data.message);
                }
            })
            .catch(err => {
                document.getElementById('siswa-sekolah').innerText = "PERINGATAN GAGAL";
                document.getElementById('siswa-nama').innerText = "Data Tidak Ditemukan";
                document.getElementById('siswa-kelas-id').innerText = err.message || "Masalah jaringan internet.";
                triggerAudioFeedback('error');
            });
        }

        function triggerAudioFeedback(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                if (type === 'success') {
                    osc.frequency.setValueAtTime(950, ctx.currentTime); gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    osc.start(); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12); osc.stop(ctx.currentTime + 0.12);
                } else {
                    osc.frequency.setValueAtTime(280, ctx.currentTime); gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    osc.start(); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35); osc.stop(ctx.currentTime + 0.35);
                }
            } catch (e) {}
        }

        function openModal() {
            const modal = document.getElementById('confirm-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.querySelector('.modal-overlay').classList.remove('opacity-0');
                document.getElementById('modal-content').classList.remove('translate-y-full');
            }, 20);
        }

        function closeModal() {
            const modal = document.getElementById('confirm-modal');
            modal.querySelector('.modal-overlay').classList.add('opacity-0');
            document.getElementById('modal-content').classList.add('translate-y-full');
            setTimeout(() => { 
                modal.classList.add('hidden'); 
                if (html5QrcodeScanner) html5QrcodeScanner.resume();
            }, 300);
        }

        function queuePresensi() {
            const now = new Date();
            const jam = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
            const internalId = 'scan_' + Date.now();
            const rawNISN = tempSiswaData.qr.split('-').length > 1 ? tempSiswaData.qr.split('-')[1] : tempSiswaData.qr;

            const queueItem = {
                id: internalId, qr: tempSiswaData.qr, nama: tempSiswaData.nama,
                kelas: tempSiswaData.kelas, petugas: tempSiswaData.petugas, jam: jam, displayNisn: rawNISN
            };

            scanQueue.push(queueItem);
            localStorage.setItem('sapa_queue', JSON.stringify(scanQueue));
            
            renderPendingLog(queueItem);
            updateSyncBadge();

            closeModal();
            processQueue();
        }

        async function processQueue() {
            if (isProcessingQueue || scanQueue.length === 0) return;
            isProcessingQueue = true;
            updateSyncBadge();

            const currentItem = scanQueue[0];

            try {
                const response = await fetch(CONFIG.scriptURL, {
                    method: 'POST',
                    body: JSON.stringify({ nisn: currentItem.qr, action: "save", petugas: currentItem.petugas })
                });
                const data = await response.json();

                if (data.status === "success") {
                    updateLogToSuccess(currentItem.id, data.nama, data.kelas, data.action, currentItem.displayNisn, currentItem.jam);
                } else {
                    updateLogToFailed(currentItem.id, data.message);
                }
                
                scanQueue.shift();
                localStorage.setItem('sapa_queue', JSON.stringify(scanQueue));

            } catch (error) {
                console.warn("Menunda pengiriman...", error);
            }

            isProcessingQueue = false;
            updateSyncBadge();
            if (scanQueue.length > 0) setTimeout(processQueue, 1500); 
        }

        function updateSyncBadge() {
            const badge = document.getElementById('sync-badge');
            if (scanQueue.length > 0) {
                badge.className = "text-[9px] font-extrabold bg-amber-100 text-amber-600 px-2 py-0.5 rounded-md uppercase tracking-wider transition-colors animate-pulse";
                badge.innerHTML = `<i data-lucide="loader-2" class="w-3 h-3 inline-block animate-spin mr-1"></i> ${scanQueue.length} Antrean`;
            } else {
                badge.className = "text-[9px] font-extrabold bg-green-100 text-green-600 px-2 py-0.5 rounded-md uppercase tracking-wider transition-colors";
                badge.innerHTML = `<i data-lucide="cloud-check" class="w-3 h-3 inline-block mr-1"></i> Tersinkron`;
            }
            lucide.createIcons();
        }

        function renderPendingLog(item) {
            const container = document.getElementById('log-container');
            const emptyState = document.getElementById('log-empty');
            if (emptyState) emptyState.remove();

            const logDiv = document.createElement('div');
            logDiv.id = item.id;
            logDiv.className = "flex items-center justify-between p-3 mb-2.5 rounded-2xl bg-white/60 dark:bg-slate-800/60 border border-slate-200/50 dark:border-slate-700/50 shadow-sm opacity-70 animate-pulse";
            logDiv.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-slate-200 dark:bg-slate-700 text-slate-500 rounded-xl"><i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i></div>
                    <div>
                        <p class="text-xs font-bold text-slate-700 dark:text-slate-200">${item.nama}</p>
                        <p class="text-[10px] font-bold text-slate-500 uppercase tracking-wide">Menyimpan ke server...</p>
                    </div>
                </div>
            `;
            container.insertBefore(logDiv, container.firstChild);
        }

        function updateLogToSuccess(id, nama, kelas, statusAbsen, rawNISN, jam) {
            const el = document.getElementById(id);
            if (el) el.remove();
            upsertCard(rawNISN, nama, kelas, statusAbsen, jam);
        }

        function updateLogToFailed(id, pesanError) {
            const el = document.getElementById(id);
            if (!el) return;
            el.className = "flex items-center justify-between p-3 mb-2.5 rounded-2xl bg-red-50 dark:bg-red-950/20 border border-red-200 dark:border-red-900/50 shadow-sm";
            el.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-red-100 text-red-600 rounded-xl"><i data-lucide="x-octagon" class="w-5 h-5"></i></div>
                    <div class="max-w-[200px]">
                        <p class="text-xs font-bold text-red-700">Ditolak Server</p>
                        <p class="text-[9px] font-semibold text-red-500 uppercase tracking-wide truncate">${pesanError}</p>
                    </div>
                </div>
            `;
            lucide.createIcons();
            triggerAudioFeedback('error');
        }

        function upsertCard(nisn, nama, kelas, statusAbsen, jam) {
            const container = document.getElementById('log-container');
            const emptyState = document.getElementById('log-empty');
            if (emptyState) emptyState.remove();

            let card = document.getElementById('card_' + nisn);
            let colorClass = statusAbsen === "Masuk" ? "text-emerald-600 bg-emerald-100 dark:bg-emerald-900/40" : "text-amber-600 bg-amber-100 dark:bg-amber-900/40";
            let iconType = statusAbsen === "Masuk" ? "log-in" : "log-out";
            
            if (!card) {
                card = document.createElement('div');
                card.id = 'card_' + nisn;
                card.className = "flex flex-col p-3.5 mb-2.5 rounded-2xl bg-white/90 dark:bg-slate-800/90 border border-slate-200/50 dark:border-slate-700/50 shadow-sm transition-all duration-500";
                
                let jamMasuk = statusAbsen === "Masuk" ? jam : "--:--";
                let jamPulang = statusAbsen === "Pulang" ? jam : "--:--";
                
                card.innerHTML = `
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-3 z-10">
                            <div class="p-2 rounded-xl ${colorClass}" id="iconbox_${nisn}"><i data-lucide="${iconType}" class="w-5 h-5"></i></div>
                            <div>
                                <p class="text-sm font-bold text-slate-800 dark:text-slate-100">${nama}</p>
                                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-wide" id="status_${nisn}">Kelas ${kelas} • Status ${statusAbsen}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 z-10">
                            <button onclick="deleteLog('${nisn}')" class="p-1.5 text-red-400 hover:text-red-600 bg-red-50 dark:bg-red-900/30 hover:bg-red-100 rounded-lg transition-colors" title="Batalkan Presensi Terakhir">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 border-t border-slate-100 dark:border-slate-700 pt-2.5">
                        <div class="flex flex-col">
                            <span class="text-[9px] font-bold text-slate-400 uppercase">Jam Masuk</span>
                            <span class="text-xs font-mono font-bold text-emerald-600 dark:text-emerald-400" id="masuk_${nisn}">${jamMasuk}</span>
                        </div>
                        <div class="flex flex-col border-l border-slate-100 dark:border-slate-700 pl-3">
                            <span class="text-[9px] font-bold text-slate-400 uppercase">Jam Pulang</span>
                            <span class="text-xs font-mono font-bold text-amber-600 dark:text-amber-400" id="pulang_${nisn}">${jamPulang}</span>
                        </div>
                    </div>
                `;
                container.insertBefore(card, container.firstChild);
            } else {
                if (statusAbsen === "Masuk") document.getElementById('masuk_' + nisn).innerText = jam;
                else if (statusAbsen === "Pulang") document.getElementById('pulang_' + nisn).innerText = jam;
                
                document.getElementById('status_' + nisn).innerText = `Kelas ${kelas} • Status ${statusAbsen}`;
                const iconBox = document.getElementById('iconbox_' + nisn);
                iconBox.className = `p-2 rounded-xl ${colorClass} z-10`;
                iconBox.innerHTML = `<i data-lucide="${iconType}" class="w-5 h-5"></i>`;
                
                card.classList.add('ring-2', 'ring-blue-400', 'scale-[1.02]');
                setTimeout(() => card.classList.remove('ring-2', 'ring-blue-400', 'scale-[1.02]'), 800);
                container.insertBefore(card, container.firstChild);
            }
            updateLogCount();
            lucide.createIcons();
        }

        // HAPUS MENGGUNAKAN SWEETALERT2
        function deleteLog(rawNISN) {
            const instansiGuru = document.getElementById('guru-instansi').innerText;
            
            Swal.fire({
                title: 'Batalkan Presensi?',
                text: "Apakah Anda yakin ingin menghapus riwayat terakhir anak ini?",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Ya, Hapus',
                cancelButtonText: 'Batal'
            }).then((result) => {
                if (result.isConfirmed) {
                    const card = document.getElementById('card_' + rawNISN);
                    if(card) card.style.opacity = '0.5';
                    
                    fetch(CONFIG.scriptURL, {
                        method: 'POST',
                        body: JSON.stringify({ action: "delete", nisn: rawNISN, instansi: instansiGuru })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if(data.status === "success") {
                            Swal.fire({ icon: 'success', title: 'Dihapus!', text: 'Presensi berhasil dibatalkan.', timer: 1500, showConfirmButton: false });
                            fetchSharedHistory(instansiGuru); 
                        } else {
                            Swal.fire('Gagal!', data.message, 'error');
                            if(card) card.style.opacity = '1';
                        }
                    }).catch(e => {
                        Swal.fire('Error!', 'Gangguan jaringan, gagal menghapus.', 'error');
                        if(card) card.style.opacity = '1';
                    });
                }
            });
        }

        function fetchSharedHistory(instansiGuru) {
            fetch(CONFIG.scriptURL, {
                method: 'POST',
                body: JSON.stringify({ action: "get_history", instansi: instansiGuru })
            })
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('log-container');
                container.innerHTML = ''; 
                
                if(data.status === "success" && data.data.length > 0) {
                    data.data.reverse().forEach(item => {
                        upsertCard(item.nisn, item.nama, item.kelas, item.status, item.jam);
                    });
                } else {
                    container.innerHTML = `<div id="log-empty" class="text-center py-8 border-2 border-dashed border-slate-200 dark:border-slate-800 rounded-2xl flex flex-col items-center justify-center text-slate-400 gap-1"><i data-lucide="history" class="w-5 h-5 opacity-60"></i><span class="text-xs">Belum ada data presensi hari ini</span></div>`;
                }
                updateLogCount();
            }).catch(e => console.log("Gagal memuat histori jaringan"));
        }

        function updateLogCount() {
            const count = document.getElementById('log-container').children.length;
            const emptyEl = document.getElementById('log-empty');
            document.getElementById('log-count').innerText = (emptyEl ? 0 : count) + " Siswa";
        }

        document.addEventListener("DOMContentLoaded", initApp);
    </script>
</body>
</html>
