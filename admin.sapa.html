<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/slg-timkreatif/ortu/refs/heads/main/sapa.png">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/slg-timkreatif/ortu/refs/heads/main/sapa.png">
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
    
    <title>SAPA - Dasbor Sekolah</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { darkbg: '#0f172a', darkcard: '#1e293b' }, fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] } } }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        .glass-panel { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.4); }
        .dark .glass-panel { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.05); }
        .blob { position: fixed; filter: blur(90px); z-index: -1; opacity: 0.4; pointer-events: none; }
        .blob-1 { top: -10%; left: -5%; width: 400px; height: 400px; background: #bfdbfe; }
        .blob-2 { bottom: -10%; right: -5%; width: 350px; height: 350px; background: #e0e7ff; }
        .dark .blob-1 { background: #1e3a8a; opacity: 0.2; }
        .dark .blob-2 { background: #312e81; opacity: 0.2; }
        
        .swal2-popup { border-radius: 1.5rem !important; font-family: 'Plus Jakarta Sans', sans-serif !important; }
        .swal2-confirm, .swal2-cancel { border-radius: 0.75rem !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-darkbg dark:text-slate-200 min-h-screen flex flex-col relative transition-colors duration-500">

    <div class="blob blob-1 animate-pulse"></div>
    <div class="blob blob-2 animate-pulse" style="animation-delay: 2s;"></div>

    <header class="glass-panel sticky top-0 z-50 border-b border-slate-200/50 dark:border-slate-800/50 px-6 py-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-3">
            <img src="https://raw.githubusercontent.com/slg-timkreatif/ortu/refs/heads/main/sapa.png" alt="Logo" class="w-10 h-10 rounded-xl shadow-sm">
            <div>
                <h1 class="text-xl font-black tracking-tight text-slate-800 dark:text-white leading-tight">Dasbor Pimpinan</h1>
                <p id="header-instansi" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Sistem Pemantauan Anak</p>
            </div>
        </div>
        
        <div class="flex items-center gap-3">
            <div class="hidden sm:flex items-center gap-2 bg-slate-100 dark:bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700">
                <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                <span class="text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Live</span>
            </div>

            <span id="live-clock" class="text-xs font-mono font-bold text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 shadow-sm hidden md:block">00:00:00</span>
            
            <button onclick="downloadCSVSekolah()" class="flex items-center gap-2 p-2.5 sm:px-4 bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-200 dark:border-emerald-800/50 rounded-xl hover:bg-emerald-100 dark:hover:bg-emerald-900/50 transition-colors shadow-sm text-emerald-600 dark:text-emerald-400" title="Unduh Arsip CSV Hari Ini">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span class="text-xs font-bold hidden sm:inline-block">Arsip CSV</span>
            </button>

            <button onclick="fetchRekapHarian()" class="p-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors shadow-sm text-blue-600 dark:text-blue-400" title="Segarkan Data Segera">
                <i data-lucide="refresh-cw" id="btn-refresh" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 w-full max-w-6xl mx-auto px-5 py-8 flex flex-col gap-8 relative z-10">
        
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 glass-panel p-6 rounded-3xl shadow-sm">
            <div>
                <h2 class="text-2xl font-extrabold text-slate-800 dark:text-slate-100" id="display-sekolah">Memuat Instansi...</h2>
                <p id="tanggal-hari-ini" class="text-sm font-medium text-slate-500 mt-1">Senin, 1 Januari 2026</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Total Peserta Didik</p>
                    <h3 class="text-2xl font-black text-blue-600 dark:text-blue-400 leading-none" id="val-total">--</h3>
                </div>
                <div class="w-12 h-12 bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-400 rounded-2xl flex items-center justify-center">
                    <i data-lucide="users" class="w-6 h-6"></i>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
            <div class="glass-panel p-6 rounded-[2rem] relative overflow-hidden group hover:shadow-lg transition-all duration-300 border-t-4 border-t-blue-500">
                <div class="absolute -right-6 -top-6 w-24 h-24 bg-blue-100 dark:bg-blue-900/30 rounded-full blur-2xl group-hover:bg-blue-200 transition-colors"></div>
                <div class="flex items-center justify-between mb-6 relative z-10">
                    <div class="p-3.5 bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-400 rounded-xl"><i data-lucide="sun" class="w-6 h-6"></i></div>
                    <span class="text-[10px] font-bold bg-blue-50 dark:bg-slate-800 text-blue-500 px-2 py-1 rounded-md border border-blue-100 dark:border-slate-700">Masuk</span>
                </div>
                <div class="relative z-10">
                    <h3 class="text-5xl font-black text-slate-800 dark:text-white tracking-tight" id="val-masuk">--</h3>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mt-2">Telah Hadir Pagi</p>
                </div>
            </div>

            <div class="glass-panel p-6 rounded-[2rem] relative overflow-hidden group hover:shadow-lg transition-all duration-300 border-t-4 border-t-emerald-500">
                <div class="absolute -right-6 -top-6 w-24 h-24 bg-emerald-100 dark:bg-emerald-900/30 rounded-full blur-2xl group-hover:bg-emerald-200 transition-colors"></div>
                <div class="flex items-center justify-between mb-6 relative z-10">
                    <div class="p-3.5 bg-emerald-100 dark:bg-emerald-900/50 text-emerald-600 dark:text-emerald-400 rounded-xl"><i data-lucide="home" class="w-6 h-6"></i></div>
                    <span class="text-[10px] font-bold bg-emerald-50 dark:bg-slate-800 text-emerald-500 px-2 py-1 rounded-md border border-emerald-100 dark:border-slate-700">Aman</span>
                </div>
                <div class="relative z-10">
                    <h3 class="text-5xl font-black text-slate-800 dark:text-white tracking-tight" id="val-pulang">--</h3>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mt-2">Sudah Pulang</p>
                </div>
            </div>

            <div class="glass-panel p-6 rounded-[2rem] relative overflow-hidden group hover:shadow-lg transition-all duration-300 border-t-4 border-t-amber-500">
                <div class="absolute -right-6 -top-6 w-24 h-24 bg-amber-100 dark:bg-amber-900/30 rounded-full blur-2xl group-hover:bg-amber-200 transition-colors"></div>
                <div class="flex items-center justify-between mb-6 relative z-10">
                    <div class="p-3.5 bg-amber-100 dark:bg-amber-900/50 text-amber-600 dark:text-amber-400 rounded-xl"><i data-lucide="mail-warning" class="w-6 h-6"></i></div>
                    <span class="text-[10px] font-bold bg-amber-50 dark:bg-slate-800 text-amber-500 px-2 py-1 rounded-md border border-amber-100 dark:border-slate-700">Surat</span>
                </div>
                <div class="relative z-10">
                    <h3 class="text-5xl font-black text-slate-800 dark:text-white tracking-tight" id="val-izin">--</h3>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mt-2">Izin & Sakit</p>
                </div>
            </div>

            <div class="glass-panel p-6 rounded-[2rem] relative overflow-hidden group hover:shadow-lg transition-all duration-300 border-t-4 border-t-red-500">
                <div class="absolute -right-6 -top-6 w-24 h-24 bg-red-100 dark:bg-red-900/30 rounded-full blur-2xl group-hover:bg-red-200 transition-colors"></div>
                <div class="flex items-center justify-between mb-6 relative z-10">
                    <div class="p-3.5 bg-red-100 dark:bg-red-900/50 text-red-600 dark:text-red-400 rounded-xl"><i data-lucide="user-x" class="w-6 h-6"></i></div>
                    <span class="text-[10px] font-bold bg-red-50 dark:bg-slate-800 text-red-500 px-2 py-1 rounded-md border border-red-100 dark:border-slate-700">Alpa</span>
                </div>
                <div class="relative z-10">
                    <h3 class="text-5xl font-black text-slate-800 dark:text-white tracking-tight" id="val-alpa">--</h3>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mt-2">Belum Terdata</p>
                </div>
            </div>
        </div>

        <div class="glass-panel p-6 rounded-3xl shadow-sm mt-2">
            <div class="flex items-center justify-between mb-3">
                <h4 class="text-sm font-bold text-slate-700 dark:text-slate-200">Persentase Kehadiran Fisik Pagi Ini</h4>
                <span id="persentase-teks" class="text-xs font-black text-blue-600 dark:text-blue-400">0%</span>
            </div>
            <div class="w-full bg-slate-100 dark:bg-slate-800 rounded-full h-4 overflow-hidden border border-slate-200 dark:border-slate-700">
                <div id="progress-bar" class="bg-gradient-to-r from-blue-500 to-blue-400 h-4 rounded-full transition-all duration-1000 ease-out w-0 relative">
                    <div class="absolute top-0 left-0 right-0 bottom-0 bg-white/20 w-full animate-pulse"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const CONFIG = {
            scriptURL: "https://script.google.com/macros/s/AKfycby1OjnfEnQNu2nSgIfSZRHGNgAJpb_qmL9ChwSzjlW3Bf8dS2jhPDpo-0R6AcuqXv7uWA/exec",
            instansiKerja: "SDN 3 Krisak" 
        };

        const savedProfile = localStorage.getItem('guru_profile');
        if (savedProfile) {
            try {
                const p = JSON.parse(savedProfile);
                if (p.instansi) CONFIG.instansiKerja = p.instansi;
            } catch(e) {}
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('header-instansi').innerText = CONFIG.instansiKerja;
            document.getElementById('display-sekolah').innerText = CONFIG.instansiKerja;
            
            setTanggalHariIni();
            initTheme();
            fetchRekapHarian();

            setInterval(fetchRekapHarian, 60000); 
        });

        // TEMA OTOMATIS MENGIKUTI SISTEM HP (Real-time)
        function initTheme() {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
            const applyTheme = (isDark) => {
                if (isDark) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            };
            applyTheme(prefersDark.matches);
            prefersDark.addEventListener('change', (e) => applyTheme(e.matches));
        }

        function setTanggalHariIni() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('tanggal-hari-ini').innerText = new Date().toLocaleDateString('id-ID', options);
        }

        setInterval(() => {
            const now = new Date();
            document.getElementById('live-clock').innerText = String(now.getHours()).padStart(2, '0') + ':' + 
                                                              String(now.getMinutes()).padStart(2, '0') + ':' + 
                                                              String(now.getSeconds()).padStart(2, '0');
        }, 1000);

        function fetchRekapHarian() {
            const btnRefresh = document.getElementById('btn-refresh');
            btnRefresh.classList.add('animate-spin');

            fetch(CONFIG.scriptURL, {
                method: 'POST',
                body: JSON.stringify({ action: "get_rekap", instansi: CONFIG.instansiKerja })
            })
            .then(res => res.json())
            .then(res => {
                if(res.status === "success") {
                    const data = res.data;
                    const totalSiswa = data.total_siswa || 0;
                    const masukPagi = data.hadir_pagi || 0;
                    const izinSakit = (data.izin || 0) + (data.sakit || 0);
                    
                    animateValue("val-total", document.getElementById("val-total").innerText, totalSiswa, 800);
                    animateValue("val-masuk", document.getElementById("val-masuk").innerText, masukPagi, 800);
                    animateValue("val-pulang", document.getElementById("val-pulang").innerText, data.sudah_pulang || 0, 800);
                    animateValue("val-izin", document.getElementById("val-izin").innerText, izinSakit, 800);
                    animateValue("val-alpa", document.getElementById("val-alpa").innerText, data.belum_hadir || 0, 800);

                    let targetSiswaHadir = totalSiswa - izinSakit;
                    let persentase = 0;
                    if (targetSiswaHadir > 0) persentase = Math.round((masukPagi / targetSiswaHadir) * 100);
                    if (persentase > 100) persentase = 100;
                    
                    document.getElementById("progress-bar").style.width = persentase + "%";
                    document.getElementById("persentase-teks").innerText = persentase + "%";

                }
            })
            .catch(err => console.error("Gangguan jaringan:", err))
            .finally(() => setTimeout(() => btnRefresh.classList.remove('animate-spin'), 500));
        }

        function animateValue(id, start, end, duration) {
            if (start === "--") start = 0;
            start = parseInt(start) || 0;
            end = parseInt(end) || 0;
            if (start === end) {
                document.getElementById(id).innerText = end;
                return;
            }
            
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const easeProgress = 1 - Math.pow(1 - progress, 3);
                document.getElementById(id).innerText = Math.floor(easeProgress * (end - start) + start);
                if (progress < 1) window.requestAnimationFrame(step);
                else document.getElementById(id).innerText = end;
            };
            window.requestAnimationFrame(step);
        }

        // CSV EXPORT DENGAN SWEETALERT
        function downloadCSVSekolah() {
            let total = document.getElementById("val-total").innerText;
            if (total === "--") {
                Swal.fire({
                    icon: 'info',
                    title: 'Harap Tunggu',
                    text: 'Data sedang dimuat, silakan tunggu beberapa saat.',
                    confirmButtonColor: '#3b82f6'
                });
                return;
            }

            let instansi = document.getElementById("display-sekolah").innerText;
            let masuk = document.getElementById("val-masuk").innerText;
            let pulang = document.getElementById("val-pulang").innerText;
            let izinSakit = document.getElementById("val-izin").innerText;
            let alpa = document.getElementById("val-alpa").innerText;
            let persen = document.getElementById("persentase-teks").innerText;
            
            const dateStr = new Date().toLocaleDateString('id-ID');
            const timeStr = document.getElementById('live-clock').innerText;

            let csvContent = "Tanggal,Jam Akses,Instansi,Total Peserta Didik,Hadir Pagi,Sudah Pulang,Izin & Sakit,Alpa,Persentase Fisik\n";
            csvContent += `"${dateStr}","${timeStr}","${instansi}",${total},${masuk},${pulang},${izinSakit},${alpa},"${persen}"\n`;

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            
            link.setAttribute("href", url);
            link.setAttribute("download", `Arsip_${instansi.replace(/\s+/g, '_')}_${dateStr.replace(/\//g, '-')}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
