name: Generate Android Keystore

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: 'Password untuk Keystore (ingat & catat!)'
        required: true
      key_password:
        description: 'Password untuk Key (bisa sama dengan di atas)'
        required: true
      key_alias:
        description: 'Alias untuk Key (contoh: my-key)'
        required: true
        default: 'my-key'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Keystore
        env:
          STORE_PASS: ${{ github.event.inputs.keystore_password }}
          KEY_PASS: ${{ github.event.inputs.key_password }}
          KEY_ALIAS: ${{ github.event.inputs.key_alias }}
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Guru Berbagi, OU=Selogiri, O=GTK, L=Selogiri, S=Jawa Tengah, C=ID"

      - name: Convert Keystore to Base64
        id: base64
        run: |
          BASE64=$(base64 -w 0 release.keystore)
          echo "keystore_base64=$BASE64" >> $GITHUB_OUTPUT

      - name: Show Base64 (untuk disalin)
        run: |
          echo "----- MULAI SALIN DARI SINI -----"
          echo "${{ steps.base64.outputs.keystore_base64 }}"
          echo "----- SAMPAI SINI -----"