name: Build TWA APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Version code'
        required: true
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set env paths
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Fix cmdline-tools and accept licenses
        run: |
          SDK="/usr/local/lib/android/sdk"
          echo "=== Struktur awal ==="
          ls -la $SDK/
          echo "=== cmdline-tools ==="
          ls -la $SDK/cmdline-tools/ || true
          
          if [ ! -e "$SDK/cmdline-tools/latest" ]; then
            VER=$(ls -d $SDK/cmdline-tools/*/ 2>/dev/null | grep -v latest | head -1)
            if [ -n "$VER" ]; then
              cd $SDK/cmdline-tools && ln -s "$(basename $VER)" latest
              echo "Symlink dibuat: latest → $(basename $VER)"
            fi
          fi
          
          echo "=== cmdline-tools setelah fix ==="
          ls -la $SDK/cmdline-tools/
          echo "=== Verifikasi sdkmanager ==="
          $SDK/cmdline-tools/latest/bin/sdkmanager --version
          
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          $SDK/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Prepare keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          echo "=== Config ==="
          cat ~/.bubblewrap/config.json

      - name: Write twa-manifest.json
        run: |
          mkdir -p twa-build
          cd twa-build
          cat > twa-manifest.json <<'TWAEOF'
          {
            "packageId": "io.github.slg_timkreatif.twa",
            "host": "slg-timkreatif.github.io",
            "name": "Guru Berbagi",
            "launcherName": "GuruBerbagi",
            "display": "standalone",
            "themeColor": "#F6F5F9",
            "themeColorDark": "#0F1115",
            "navigationColor": "#FFFFFF",
            "navigationColorDark": "#0F1115",
            "navigationDividerColor": "#FFFFFF",
            "navigationDividerColorDark": "#1F2937",
            "backgroundColor": "#F6F5F9",
            "enableNotifications": true,
            "startUrl": "/app/",
            "iconUrl": "https://raw.githubusercontent.com/slg-timkreatif/app/refs/heads/main/1768315347206.png",
            "maskableIconUrl": "https://raw.githubusercontent.com/slg-timkreatif/app/refs/heads/main/1768315347206.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "signingKey": {
              "path": "/tmp/release.keystore",
              "alias": "my-key"
            },
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://slg-timkreatif.github.io/app/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://slg-timkreatif.github.io/app/",
            "minSdkVersion": 21,
            "orientation": "portrait"
          }
          TWAEOF

      - name: Fill passwords + alias
        working-directory: twa-build
        run: |
          jq --arg s "${{ secrets.KEYSTORE_PASSWORD }}" \
             --arg k "${{ secrets.KEY_PASSWORD }}" \
             --arg a "${{ secrets.KEY_ALIAS }}" \
             --arg vn "${{ github.event.inputs.version_name }}" \
             --argjson vc ${{ github.event.inputs.version_code }} \
             '.storePassword=$s | .keyPassword=$k | .signingKey.alias=$a | .appVersionName=$vn | .appVersionCode=$vc' \
             twa-manifest.json > tmp.json && mv tmp.json twa-manifest.json

      - name: Generate Android project
        working-directory: twa-build
        run: |
          printf '1.0.0\n' | bubblewrap update --skipPwaValidation

      - name: Build APK
        working-directory: twa-build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bubblewrap build --skipPwaValidation

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: |
            twa-build/*.apk
            twa-build/*.aab
            twa-build/app/build/outputs/**/*.apk
            twa-build/app/build/outputs/**/*.aab
          if-no-files-found: warn