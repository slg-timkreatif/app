name: Build TWA APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (mis. 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Version code (naik 1 tiap rilis)'
        required: true
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la $ANDROID_HOME/ 2>/dev/null || true

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Prepare keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
          ls -la /tmp/release.keystore

      - name: Generate TWA project
        run: |
          mkdir -p twa-build
          cd twa-build
          printf 'y\ny\ny\ny\ny\n' | bubblewrap init \
            --manifest https://slg-timkreatif.github.io/app/manifest.json \
            --directory . \
            --skipPwaValidation || true
          echo "=== Files ==="
          ls -la
          if [ ! -f twa-manifest.json ]; then
            echo "❌ twa-manifest.json tidak ada"
            exit 1
          fi

      - name: Configure signing
        working-directory: ./twa-build
        run: |
          jq --arg store "${{ secrets.KEYSTORE_PASSWORD }}" \
             --arg key "${{ secrets.KEY_PASSWORD }}" \
             --arg alias "${{ secrets.KEY_ALIAS }}" \
             '. + {signingKey: {path: "/tmp/release.keystore", alias: $alias}} | .keyPassword = $key | .storePassword = $store' \
             twa-manifest.json > tmp.json && mv tmp.json twa-manifest.json

      - name: Update version
        working-directory: ./twa-build
        run: |
          jq --arg vn "${{ github.event.inputs.version_name }}" \
             --argjson vc ${{ github.event.inputs.version_code }} \
             '.appVersionName = $vn | .appVersionCode = $vc' \
             twa-manifest.json > tmp.json && mv tmp.json twa-manifest.json

      - name: Build APK
        working-directory: ./twa-build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bubblewrap build --skipPwaValidation

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gurubersbagi-v${{ github.event.inputs.version_name }}
          path: |
            twa-build/*.apk
            twa-build/*.aab
          retention-days: 30