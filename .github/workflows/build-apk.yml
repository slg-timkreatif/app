name: Build TWA APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Version code'
        required: true
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set Android SDK path
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK components
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "platforms;android-34" \
            "build-tools;33.0.2" \
            "build-tools;34.0.0" 2>&1 | tail -15

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Prepare keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
          ls -la /tmp/release.keystore

      - name: Configure Bubblewrap paths
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json << EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          echo "=== Config ==="
          cat ~/.bubblewrap/config.json

      - name: Write twa-manifest.json
        run: |
          mkdir -p twa-build
          cd twa-build
          cat > twa-manifest.json << 'TWA_EOF'
          {
            "packageId": "io.github.slg_timkreatif.twa",
            "host": "slg-timkreatif.github.io",
            "name": "Guru Berbagi",
            "launcherName": "GuruBerbagi",
            "display": "standalone",
            "themeColor": "#F6F5F9",
            "themeColorDark": "#0F1115",
            "navigationColor": "#FFFFFF",
            "navigationColorDark": "#0F1115",
            "navigationDividerColor": "#FFFFFF",
            "navigationDividerColorDark": "#1F2937",
            "backgroundColor": "#F6F5F9",
            "enableNotifications": true,
            "startUrl": "/app/",
            "iconUrl": "https://raw.githubusercontent.com/slg-timkreatif/app/refs/heads/main/1768315347206.png",
            "maskableIconUrl": "https://raw.githubusercontent.com/slg-timkreatif/app/refs/heads/main/1768315347206.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "signingKey": {
              "path": "/tmp/release.keystore",
              "alias": "my-key"
            },
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://slg-timkreatif.github.io/app/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://slg-timkreatif.github.io/app/",
            "minSdkVersion": 21,
            "orientation": "portrait"
          }
          TWA_EOF

      - name: Fill passwords + alias + version
        working-directory: ./twa-build
        run: |
          jq --arg store "${{ secrets.KEYSTORE_PASSWORD }}" \
             --arg key "${{ secrets.KEY_PASSWORD }}" \
             --arg alias "${{ secrets.KEY_ALIAS }}" \
             --arg vn "${{ github.event.inputs.version_name }}" \
             --argjson vc ${{ github.event.inputs.version_code }} \
             '.keyPassword = $key | .storePassword = $store | .signingKey.alias = $alias | .appVersionName = $vn | .appVersionCode = $vc' \
             twa-manifest.json > tmp.json && mv tmp.json twa-manifest.json
          echo "Alias: $(jq -r .signingKey.alias twa-manifest.json)"

      - name: Generate Android project
        working-directory: ./twa-build
        run: |
          printf '1.0.0\n' | bubblewrap update --skipPwaValidation

      - name: Build APK
        working-directory: ./twa-build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bubblewrap build --skipPwaValidation

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gurubersbagi-v${{ github.event.inputs.version_name }}
          path: |
            twa-build/*.apk
            twa-build/*.aab
          retention-days: 30