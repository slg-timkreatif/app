name: Build TWA APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Version code'
        required: true
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup and fix Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK"
          echo "SDK=$SDK" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          
          echo "=== Struktur SDK ==="
          ls -la $SDK/
          echo "=== cmdline-tools ==="
          ls -la $SDK/cmdline-tools/ || true
          
          # Buat symlink latest kalau tidak ada
          if [ ! -e "$SDK/cmdline-tools/latest" ]; then
            CMDTOOLS_VER=$(ls -d $SDK/cmdline-tools/*/ 2>/dev/null | grep -v latest | head -1 | xargs -n1 basename 2>/dev/null)
            if [ -n "$CMDTOOLS_VER" ]; then
              echo "Membuat symlink latest → $CMDTOOLS_VER"
              cd $SDK/cmdline-tools && ln -s "$CMDTOOLS_VER" latest
            fi
          fi
          
          echo "=== cmdline-tools setelah fix ==="
          ls -la $SDK/cmdline-tools/
          
          # Verify sdkmanager
          $SDK/cmdline-tools/latest/bin/sdkmanager --version || echo "sdkmanager tidak bisa jalan"

      - name: Accept licenses and install SDK packages
        run: |
          SDK="$ANDROID_HOME"
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $SDK/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5
          
          echo "=== Verifikasi ==="
          ls -la $SDK/platforms/ || true
          ls -la $SDK/build-tools/ || true

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Prepare keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore

      - name: Configure Bubblewrap (tanpa config file)
        run: |
          # Jangan pakai config file — biarkan bubblewrap fallback ke env var
          rm -rf ~/.bubblewrap
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          test -d "$ANDROID_HOME" && echo "SDK OK" || echo "SDK MISSING"
          test -d "$JAVA_HOME" && echo "JDK OK" || echo "JDK MISSING"
          test -e "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" && echo "sdkmanager OK" || echo "sdkmanager MISSING"

      - name: Write twa-manifest.json
        run: |
          mkdir -p twa-build
          cd twa-build
          cat > twa-manifest.json <<'TWAEOF'
          {
            "packageId": "io.github.slg_timkreatif.twa",
            "host": "slg-timkreatif.github.io",
            "name": "Guru Berbagi",
            "launcherName": "GuruBerbagi",
            "display": "standalone",
            "themeColor": "#F6F5F9",
            "themeColorDark": "#0F1115",
            "navigationColor": "#FFFFFF",
            "navigationColorDark": "#0F1115",
            "navigationDividerColor": "#FFFFFF",
            "navigationDividerColorDark": "#1F2937",
            "backgroundColor": "#F6F5F9",
            "enableNotifications": true,
            "startUrl": "/app/",
            "iconUrl": "https://raw.githubusercontent.com/slg-timkreatif/app/refs/heads/main/1768315347206.png",
            "maskableIconUrl": "https://raw.githubusercontent.com/slg-timkreatif/app/refs/heads/main/1768315347206.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "signingKey": {
              "path": "/tmp/release.keystore",
              "alias": "my-key"
            },
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://slg-timkreatif.github.io/app/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://slg-timkreatif.github.io/app/",
            "minSdkVersion": 21,
            "orientation": "portrait"
          }
          TWAEOF

      - name: Fill passwords + alias
        working-directory: twa-build
        run: |
          jq --arg s "${{ secrets.KEYSTORE_PASSWORD }}" \
             --arg k "${{ secrets.KEY_PASSWORD }}" \
             --arg a "${{ secrets.KEY_ALIAS }}" \
             --arg vn "${{ github.event.inputs.version_name }}" \
             --argjson vc ${{ github.event.inputs.version_code }} \
             '.storePassword=$s | .keyPassword=$k | .signingKey.alias=$a | .appVersionName=$vn | .appVersionCode=$vc' \
             twa-manifest.json > tmp.json && mv tmp.json twa-manifest.json

      - name: Generate Android project
        working-directory: twa-build
        run: |
          printf '1.0.0\n' | bubblewrap update --skipPwaValidation

      - name: Build APK
        working-directory: twa-build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la $ANDROID_HOME/cmdline-tools/latest/bin/ || true
          bubblewrap build --skipPwaValidation

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: |
            twa-build/*.apk
            twa-build/*.aab
            twa-build/app/build/outputs/**/*.apk
            twa-build/app/build/outputs/**/*.aab
          if-no-files-found: warn